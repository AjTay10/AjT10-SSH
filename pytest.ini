[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = --strict-markers --tb=short -q
# The suite is offline by design: every upstream payload is a recorded fixture
# and tests/conftest.py::no_network turns a stray request into a failure. Keep
# it that way — a test that needs the internet belongs in
# scripts/agent-reach-verify.sh, which is where live checks live.
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:bs4.*
