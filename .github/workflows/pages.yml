name: pages

# Publishes docs/ (a byte-identical copy of studio/index.html) to GitHub Pages.
# Settings → Pages → Source is set to GitHub Actions, so every push to a branch
# below republishes the tool at https://<owner>.github.io/<repo>/
#
# Publishing branches only. The github-pages environment restricts deployment
# to protected branches, so a feature branch reaches `deploy`, gets rejected by
# the environment, and reports the whole run as failed while master publishes
# fine seconds later. Listing only the branches allowed to deploy keeps a red X
# from meaning nothing.

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish a stale build
        run: python3 studio/build.py --check

      - name: Refuse to publish anything that reaches the network
        run: |
          python3 - <<'PY'
          # The whole promise of this tool is that a client's data never leaves
          # their machine. Publishing a build that could phone home would break
          # that promise silently, so it fails the deploy instead.
          html = open("docs/index.html", encoding="utf-8").read()
          scan = html.replace('xmlns="http://www.w3.org/2000/svg"', "")
          bad = [s for s in ("http://", "https://", "cdn.", "fetch(",
                             "XMLHttpRequest", "WebSocket", "@import",
                             "<link", "sendBeacon") if s in scan]
          if bad:
              raise SystemExit(f"docs/index.html reaches the network: {bad}")
          print(f"docs/index.html is self-contained ({len(html):,} bytes)")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
