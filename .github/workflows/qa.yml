name: qa

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the tools claim to support; if it breaks there,
        # the README is lying.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Config integrity
        run: python3 qa/validate.py

      - name: Adversarial tests
        run: python3 qa/selftest.py -v

      - name: Tools have no third-party imports
        run: |
          python3 - <<'PY'
          import ast, os, sys
          # The whole point of tools/ is that it runs anywhere with no install
          # step. This fails the build the moment someone adds a dependency.
          stdlib = set(getattr(sys, "stdlib_module_names", ())) | {
              "chartkit", "anomaly", "calendar_gen", "kg", "metrics",
              "abtest", "social_ingest", "dashboard", "csvio",
          }
          bad = []
          for fn in sorted(os.listdir("tools")):
              if not fn.endswith(".py"):
                  continue
              tree = ast.parse(open(f"tools/{fn}", encoding="utf-8").read())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0:
                      mods = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for m in mods:
                      if m and m not in stdlib:
                          bad.append(f"tools/{fn}: imports {m!r}")
          if bad:
              print("\n".join(bad))
              raise SystemExit("tools/ must be stdlib-only")
          print("tools/ is stdlib-only")
          PY

      - name: Installer is safe to run twice
        run: |
          export CLAUDE_HOME="$RUNNER_TEMP/claude"
          ./install.sh
          ./install.sh | tee /tmp/second.txt
          grep -q "added 0, skipped 0" /tmp/second.txt \
            || { echo "second run was not idempotent"; cat /tmp/second.txt; exit 1; }
          ./install.sh --uninstall
