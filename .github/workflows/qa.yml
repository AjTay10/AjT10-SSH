name: qa

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the tools claim to support; if it breaks there,
        # the README is lying.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Config integrity
        run: python3 qa/validate.py

      - name: Adversarial tests
        run: python3 qa/selftest.py -v

      # Lives in qa/ rather than inline here on purpose. As a heredoc it could
      # not be run locally, and a version-specific bug in it went unnoticed
      # through every commit; qa/selftest.py now covers it.
      - name: Tools have no third-party imports
        run: python3 qa/no_deps.py

      - name: Demo report is not stale
        run: python3 demo/build.py --check

      - name: Studio build is current
        run: |
          python3 studio/fixtures.py
          python3 studio/build.py --check
          python3 studio/parity_expected.py
          git diff --exit-code studio/fixtures studio/parity_expected.json

      - name: Studio engine agrees with the Python tools
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run parity check
        run: node studio/parity.mjs

      - name: Installer is safe to run twice
        run: |
          export CLAUDE_HOME="$RUNNER_TEMP/claude"
          ./install.sh
          ./install.sh | tee /tmp/second.txt
          grep -q "added 0, skipped 0" /tmp/second.txt \
            || { echo "second run was not idempotent"; cat /tmp/second.txt; exit 1; }
          ./install.sh --uninstall
