<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- TayTested avatar — 800x800, safe inside YouTube's circular crop (r=400) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131A22"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <!-- faint gauge arc: the "tested" motif -->
  <circle cx="400" cy="400" r="310" fill="none" stroke="#1F2A36" stroke-width="26"/>
  <circle cx="400" cy="400" r="310" fill="none" stroke="#2BD576" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="1460 488"
          transform="rotate(126 400 400)"/>
  <!-- Bold T -->
  <g fill="#F5F7FA">
    <rect x="230" y="230" width="340" height="86" rx="10"/>
    <rect x="357" y="230" width="86" height="330" rx="10"/>
  </g>
  <!-- Check stroke completing the T's stem -->
  <path d="M 330 512 L 400 588 L 566 386" fill="none" stroke="#2BD576"
        stroke-width="86" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
