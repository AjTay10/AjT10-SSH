<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Archivo Black, Arial Black, sans-serif">
  <!-- TayTested thumbnail system — 1280x720 (16:9).
       Layer your gameplay screenshot UNDER this file's overlay elements.
       Rules: max 3 words, one verdict stamp, legible at 120px wide. -->
  <!-- gameplay placeholder -->
  <rect width="1280" height="720" fill="#131A22"/>
  <text x="470" y="370" text-anchor="middle" font-size="40" fill="#1F2A36" font-family="Inter, Arial, sans-serif">[ gameplay screenshot ]</text>
  <!-- bottom gradient strip anchors the text -->
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0B0F14" stop-opacity="0"/>
    <stop offset="1" stop-color="#0B0F14" stop-opacity="0.92"/>
  </linearGradient>
  <rect y="430" width="1280" height="290" fill="url(#fade)"/>
  <!-- headline: MAX 3 WORDS, must not repeat the title -->
  <text x="48" y="640" font-size="112" font-weight="900" fill="#F5F7FA" stroke="#0B0F14" stroke-width="10" paint-order="stroke">ACID LAB<tspan fill="#2BD576"> FIRST</tspan></text>
  <!-- VERDICT STAMP — use exactly one; swap text/color for the verdict -->
  <g transform="translate(1010 120) rotate(9)">
    <rect x="-172" y="-62" width="344" height="124" rx="18" fill="none" stroke="#2BD576" stroke-width="14"/>
    <text y="34" text-anchor="middle" font-size="88" font-weight="900" fill="#2BD576" letter-spacing="4">BUY</text>
  </g>
  <!-- SKIP variant: stroke/fill #FF4757, text SKIP -->
  <!-- TESTED variant: stroke/fill #FFB020, text TESTED, font-size 62 -->
  <!-- series chip, top-left -->
  <g font-family="Inter, Arial, sans-serif" font-weight="800">
    <rect x="40" y="40" width="330" height="66" rx="33" fill="#2BD576"/>
    <text x="205" y="86" text-anchor="middle" font-size="34" fill="#0B0F14">WORTH IT · THU</text>
  </g>
</svg>
